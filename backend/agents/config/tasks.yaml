# backend/agents/config/tasks.yaml

job_search_task:
  description: >
    Search for 5-10 active job listings for {job_title}. 
    Focus on these specific requirements: {skills}.
    Identify the company name, location, and application link.
  expected_output: >
    A list of dictionaries containing 'company', 'role', 'link', and 'summary'.
  agent: job_hunter_agent

